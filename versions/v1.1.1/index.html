<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#0b5362">
  <meta name="description" content="ספר של אילן לטיולי הכביש לאופנועים בישראל — 90 מסלולים, סיפורי דרך וניווט.">
  <title>ספר הטיולים של אילן — גרסת מסמך 1.1.1</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eef4f7; }
    #book { width: 100%; height: 100%; border: 0; display: block; background: #eef4f7; }
    #install {
      position: fixed; z-index: 10; left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom)); border: 0; border-radius: 999px;
      padding: 12px 18px; background: #0b5362; color: #fff; font-weight: 700;
      font-size: 15px; box-shadow: 0 5px 18px #001d2b55; cursor: pointer;
    }
    #install:hover { background: #087f8c; }
    #install[hidden] { display: none; }
    #offline {
      position: fixed; z-index: 11; right: 14px; bottom: 14px; display: none;
      padding: 8px 12px; border-radius: 10px; background: #8c2d35; color: #fff;
      font-size: 13px; font-weight: 700;
    }
    body.is-offline #offline { display: block; }
  </style>
</head>
<body>
  <iframe id="book" src="./book.html" title="ספר של אילן לטיולי הכביש לאופנועים בישראל"></iframe>
  <button id="install" type="button">התקנת האפליקציה</button>
  <div id="offline" role="status">מצב לא מקוון</div>
  <script>
    const installButton = document.getElementById('install');
    let installPrompt = null;

    if (matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installButton.hidden = true;
    }

    addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener('click', async () => {
      if (!installPrompt) {
        alert('אם חלון ההתקנה אינו מופיע, פתחו את תפריט Chrome ובחרו “התקנת ספר הטיולים של אילן — גרסת מסמך 1.1.1”.');
        return;
      }
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
    });

    addEventListener('appinstalled', () => { installButton.hidden = true; });
    const updateConnection = () => document.body.classList.toggle('is-offline', !navigator.onLine);
    addEventListener('online', updateConnection);
    addEventListener('offline', updateConnection);
    updateConnection();

    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
